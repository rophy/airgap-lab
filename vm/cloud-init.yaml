#cloud-config

ssh_pwauth: true
package_update: true

packages:
  - docker.io
  - curl
  - jq

users:
  - default
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: ubuntu
    ssh_authorized_keys: SSH_AUTHORIZED_KEYS

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu

  # Configure Docker daemon to use host registry as insecure
  # BRIDGE_HOST_IP and REGISTRY_PORT are replaced at launch time
  - |
    cat > /etc/docker/daemon.json <<EOF
    {
      "insecure-registries": ["BRIDGE_HOST_IP:REGISTRY_PORT"]
    }
    EOF
    systemctl restart docker
