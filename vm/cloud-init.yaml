#cloud-config

package_update: true

packages:
  - docker.io
  - curl
  - jq

runcmd:
  # Enable and start docker
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu

  # Configure Docker daemon to use host registry as insecure
  # BRIDGE_HOST_IP is replaced by create-vm.sh at launch time
  - |
    cat > /etc/docker/daemon.json <<EOF
    {
      "insecure-registries": ["BRIDGE_HOST_IP:REGISTRY_PORT"]
    }
    EOF
    systemctl restart docker
