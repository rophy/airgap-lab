#cloud-config

package_update: true

packages:
  - docker.io
  - curl
  - jq

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    # password: ubuntu (hashed)
    passwd: $6$rounds=4096$saltsalt$Yjz1U1q6Gp5FhkGIHnMmQqXlEqKpq9kJxOdE8v1MzVQqr3TKxGzGiEPaEMq6gSkvYmz0iFhKMg.GfHFmqMOj0

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu

  # Configure Docker daemon to use host registry as insecure
  # BRIDGE_HOST_IP and REGISTRY_PORT are replaced at launch time
  - |
    cat > /etc/docker/daemon.json <<EOF
    {
      "insecure-registries": ["BRIDGE_HOST_IP:REGISTRY_PORT"]
    }
    EOF
    systemctl restart docker
