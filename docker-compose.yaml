services:
  registry:
    image: registry:2
    container_name: airgap-registry
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

  apt-cache:
    image: sameersbn/apt-cacher-ng:3.7.4-20220421
    container_name: airgap-apt-cache
    ports:
      - "3142:3142"
    volumes:
      - apt-cache-data:/var/cache/apt-cacher-ng
    restart: unless-stopped

  ai-gateway:
    image: nginx:alpine
    container_name: airgap-ai-gateway
    ports:
      - "${AI_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./config/ai-gateway/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./config/ai-gateway/entrypoint.sh:/entrypoint.sh:ro
      - ${LLM_API_KEY_FILE:-~/.airgap-lab/api-key}:/run/secrets/api-key:ro
    environment:
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.anthropic.com}
    entrypoint: /entrypoint.sh
    restart: unless-stopped

volumes:
  registry-data:
  apt-cache-data:
